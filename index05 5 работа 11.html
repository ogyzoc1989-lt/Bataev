<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Японский список задач • 桜タスク</title>
    <!-- Подключаем японские и современные шрифты Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        /* 4. Японская палитра (Wabi-Sabi / Sakura Theme) */
        :root {
            --bg-color: #f4f0ea;
            /* Цвет рисовой бумаги / светлого камня */
            --card-bg: rgba(255, 255, 255, 0.85);
            /* Полупрозрачный матовый блок */
            --accent-red: #bc002d;
            /* Традиционный алый японский цвет (Akai) */
            --accent-hover: #9e0024;
            /* Темный алый для наведения */
            --text-main: #2b2b2b;
            /* Цвет туши (Sumizumi) */
            --text-muted: #8c857b;
            /* Приглушенный серо-бежевый */
            --border-color: #e2dacd;
            /* Тонкая рамка */
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 2. Задний фон: горы и падающие лепестки сакуры */
        .mountain-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            background: linear-gradient(to top, #d8d0c1, transparent);
            z-index: 0;
            pointer-events: none;
        }

        /* Силуэты гор */
        .mountain-bg::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0,300 L0,150 Q250,50 500,180 T1000,100 L1200,200 L1200,300 Z" fill="%23e8e2d5" opacity="0.7"/><path d="M0,300 L0,220 Q350,90 700,200 T1200,150 L1200,300 Z" fill="%23dfd7c8" opacity="0.9"/></svg>') no-repeat bottom;
            background-size: cover;
        }

        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Основной контейнер приложения */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 2;
            animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .japanese-subtitle {
            font-family: 'Noto Serif JP', serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--accent-red);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* 1. Блок статистики */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(250, 248, 245, 0.8);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-weight: 700;
            font-size: 18px;
            color: var(--accent-red);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Поле ввода задачи */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
        }

        input[type="text"]:focus {
            border-color: var(--accent-red);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(188, 0, 45, 0.08);
        }

        /* 3. Анимации кнопок */
        button.add-btn {
            background-color: var(--accent-red);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 0 22px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(188, 0, 45, 0.25);
        }

        button.add-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(188, 0, 45, 0.35);
        }

        button.add-btn:active {
            transform: scale(0.94) translateY(0);
            box-shadow: 0 2px 6px rgba(188, 0, 45, 0.2);
        }

        /* Список дел */
        .task-list {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-list::-webkit-scrollbar {
            width: 4px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(250, 248, 245, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: taskSlideIn 0.3s ease forwards;
        }

        @keyframes taskSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item:hover {
            border-color: #d1c7b7;
            transform: translateX(3px);
        }

        .task-item.completed {
            background: rgba(238, 234, 226, 0.6);
            opacity: 0.65;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
            user-select: none;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: white;
        }

        .task-item.completed .checkbox {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            transform: scale(1.05);
        }

        .checkbox::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }

        .task-item.completed .checkbox::after {
            display: block;
        }

        .task-text {
            font-size: 15px;
            word-break: break-word;
            transition: color 0.2s ease;
        }

        /* Кнопка удаления с плавной анимацией */
        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            color: var(--accent-red);
            background: rgba(188, 0, 45, 0.08);
            transform: scale(1.1);
        }

        .delete-btn:active {
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Фоновые горы -->
    <div class="mountain-bg"></div>

    <!-- Анимация лепестков сакуры (Canvas) -->
    <canvas id="sakura-canvas"></canvas>

    <!-- Интерактивное приложение -->
    <div class="container">
        <header>
            <div class="japanese-subtitle">桜タスクマネージャー</div>
            <h1>Список Дел</h1>
        </header>

        <!-- Статистика / Счётчик -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="total-count">0</span>
                <span class="stat-label">Всего</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="active-count">0</span>
                <span class="stat-label">Активные</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="completed-count">0</span>
                <span class="stat-label">Готово</span>
            </div>
        </div>

        <!-- Форма добавления -->
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Добавить новую задачу..." maxlength="60">
            <button class="add-btn" id="add-btn" title="Добавить">＋</button>
        </div>

        <!-- Список задач -->
        <ul class="task-list" id="task-list"></ul>

        <div class="empty-state" id="empty-state">Список пока пуст, добавьте дело 🌸</div>
    </div>

    <script>
        // --- 1. ЛОГИКА ПРИЛОЖЕНИЯ И СЧЕТЧИК ---
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');

        const totalCountEl = document.getElementById('total-count');
        const activeCountEl = document.getElementById('active-count');
        const completedCountEl = document.getElementById('completed-count');

        let tasks = [];

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(newTask);
            taskInput.value = ''; renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task =>
                task.id === id ? { ...task, completed: !task.completed } : task
            );
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
        }

        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;

                li.innerHTML = `
                    <div class="task-content" onclick="toggleTask(${task.id})">
                        <div class="checkbox"></div>
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})" title="Удалить">✕</button>
                `;

                taskList.appendChild(li);
            });

            // Обновление счетчиков
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;

            totalCountEl.textContent = total;
            activeCountEl.textContent = active;
            completedCountEl.textContent = completed;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });


        // --- 2. АНИМАЦИЯ ПАДАЮЩИХ ЛЕПЕСТКОВ САКУРЫ ---
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const petals = [];
        const petalCount = 30;

        class Petal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 7 + 4;
                this.speedY = Math.random() * 0.8 + 0.5;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 1.5 - 0.75;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 50) * 0.3;
                this.angle += this.spin;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ffb7c5'; // Нежно-розовый цвет сакуры

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
                ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
                ctx.fill();

                ctx.restore();
            }
        }

        for (let i = 0; i < petalCount; i++) {
            petals.push(new Petal());
        }

        function animateSakura() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animateSakura);
        }

        animateSakura();
    </script>
</body>

</html>
