<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 400px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        button.delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        .counter {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Список задач</h2>

        <div>
            <input type="text" id="taskInput" placeholder="Введите новую задачу...">
            <button id="addButton">Добавить</button>
        </div>

        <ul id="taskList"></ul>

        <div class="counter">
            Всего задач: <span id="taskCount">0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
