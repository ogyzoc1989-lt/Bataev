<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 4 - this в DOM-событиях</title>
</head>

<body>

    <!-- Создайте HTML-страницу с двумя кнопками[span_2](start_span)[span_2](end_span) -->
    <button id="regular">Обычная функция</button>
    <button id="arrow">Стрелочная функция</button>

    <script>
        const btnRegular = document.getElementById('regular');
        const btnArrow = document.getElementById('arrow');

        // 1. Для первой кнопки — обработчик через обычную function[span_3](start_span)[span_3](end_span)
        btnRegular.addEventListener('click', function (event) {
            console.log("--- Обычная функция ---");
            console.log("this:", this);                     // Ссылается на саму кнопку (<button>)
            console.log("event.currentTarget:", event.currentTarget); // Тоже элемент, на котором сработало событие
        });

        // 2. Для второй кнопки — обработчик через стрелочную функцию[span_4](start_span)[span_4](end_span)
        btnArrow.addEventListener('click', (event) => {
            console.log("--- Стрелочная функция ---");
            console.log("this:", this);                     // Ссылается на внешний контекст (в данном случае на window)
            console.log("event.currentTarget:", event.currentTarget); // Ссылается на саму кнопку (<button>)
        });
    </script>

</body>

</html>
