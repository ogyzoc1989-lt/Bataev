<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Домашнее задание - Карточка сотрудника</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f4f4f9;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
        }

        button:hover {
            background: #eee;
        }
    </style>
</head>

<body>

    <h1>Домашнее задание: Карточка сотрудника</h1>

    <br><br>
    <button id="employee-btn">Нажми на меня (DOM-событие)</button>

    <script>
        const employee = {
            name: 'Алексей',
            position: 'Frontend Developer',
            department: 'IT-отдел',

            showCard: function () {
                console.log(`Сотрудник: ${this.name}, Должность: ${this.position}, Отдел: ${this.department}`);
            }
        };

        console.log("--- 1. Вызов метода объекта ---");
        employee.showCard();

        console.log("--- 2. Потеря контекста при вызове из переменной ---");
        const looseShowCard = employee.showCard;
        looseShowCard();
        console.log("--- 3. Исправление ситуации через bind() ---");
        const boundShowCard = employee.showCard.bind(employee);
        boundShowCard();
    
        function showCardInCity(city) {
            console.log(`Сотрудник: ${this.name}, Должность: ${this.position}, Отдел: ${this.department}, Город: ${city}`);
        }

        console.log("--- 4. Вызов через call() ---");
        showCardInCity.call(employee, 'Санкт-Петербург');

        console.log("--- 5. Вызов через apply() ---");
        showCardInCity.apply(employee, ['Москва']);

        const btn = document.getElementById('employee-btn');

        btn.addEventListener('click', function (event) {
            console.log("--- 6. DOM-событие: Обычная функция ---");
            console.log("this (равен кнопке):", this);
            console.log("event.currentTarget:", event.currentTarget);
        });

        btn.addEventListener('click', (event) => {
            console.log("--- 7. DOM-событие: Стрелочная функция ---");
            console.log("this (лексический, равен window):", this);
            console.log("event.currentTarget (всегда элемент):", event.currentTarget);
        });
    </script>

</body>

</html>
